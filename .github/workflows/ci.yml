name: ci

# The project is written on Windows, so this is what says whether it still
# builds anywhere else. Every push runs the tests on the three platforms it
# claims to support, and installs the binary it just built on each of them:
# the binary is its own installer, so that is the installer being tested.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p kebacc-antigravity

      - name: Test
        run: cargo test --release -p kebacc-antigravity

      - name: Clippy
        run: cargo clippy --release --all-targets -p kebacc-antigravity -- -D warnings

      # A binary that will not start says so here rather than on a user's
      # machine after the release is out.
      - name: It runs
        run: cargo run --release -p kebacc-antigravity -- --version

      # The version a plugin stamps into its marker file, the version the binary
      # reports, and the version cargo built are three copies of one number. A
      # release where they disagree installs a binary that then thinks it is out
      # of date, and updates itself in a loop.
      - name: The versions agree
        if: runner.os != 'Windows'
        run: |
          set -eu
          crate=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' crates/kebacc-antigravity/Cargo.toml | head -n 1)
          marked=$(tr -d ' \t\r\n' < plugins/kebacc-antigravity/VERSION)
          test "$marked" = "$crate" || {
            echo "plugins/kebacc-antigravity/VERSION is $marked, the crate is $crate" >&2
            exit 1
          }
          echo "every VERSION says $crate"

      # The binary carries the slash commands inside it, one include_str! each,
      # so a command added to the directory and forgotten in COMMANDS ships as
      # a command nobody gets, and a name left in COMMANDS after its file is
      # deleted fails the build. The sweep side of the same promise — that
      # every shipped command is one the uninstall also takes back — is a unit
      # test in install.rs.
      - name: Every command on disk is one the binary carries
        if: runner.os != 'Windows'
        run: |
          set -eu
          bad=0
          # The include_str! paths, not every quoted name in the file: the
          # tests name commands this plugin deliberately does not carry.
          carried=$(grep -o 'commands/kebacc-[^"]*\.md' crates/kebacc-antigravity/src/cmd/install.rs |
            sed 's|.*/||' | sort -u)
          for file in plugins/kebacc-antigravity/src/commands/*.md; do
            name=${file##*/}
            echo "$carried" | grep -qx "$name" ||
              { echo "$name is on disk but not carried by the binary" >&2; bad=1; }
          done
          for name in $carried; do
            [ -f "plugins/kebacc-antigravity/src/commands/$name" ] ||
              { echo "$name is carried by the binary but not on disk" >&2; bad=1; }
          done
          test "$bad" = 0
          echo "$(ls plugins/kebacc-antigravity/src/commands/*.md | wc -l | tr -d ' ') commands, all carried"

      # There is no install script any more: `kebacc-antigravity install` is the
      # installer, and it carries the slash commands inside it. What used to be
      # install.sh and install.ps1 is this one code path, run here for real on
      # every platform, against directories made for the occasion.
      - name: The binary installs and uninstalls itself
        if: runner.os != 'Windows'
        run: |
          set -eu
          sandbox=$(mktemp -d)
          export HOME="$sandbox/home"
          export CLAUDE_CONFIG_DIR="$sandbox/claude"
          export KEBACC_SWITCH_ANTIGRAVITY_ACCOUNTS="$sandbox/accounts"
          mkdir -p "$HOME" "$CLAUDE_CONFIG_DIR"
          echo '{"model":"opus"}' > "$CLAUDE_CONFIG_DIR/settings.json"

          target/release/kebacc-antigravity install --status-line --auto-switch antigravity

          test -x "$HOME/.claude-tools/kebacc-antigravity"
          test "$(cat "$HOME/.claude-tools/.antigravity-version")" = "$(cat plugins/kebacc-antigravity/VERSION)"
          test -f "$CLAUDE_CONFIG_DIR/commands/kebacc-list-antigravity.md"
          grep -q '"model": *"opus"' "$CLAUDE_CONFIG_DIR/settings.json"
          grep -q 'statusLine' "$CLAUDE_CONFIG_DIR/settings.json"
          grep -q 'SessionStart' "$CLAUDE_CONFIG_DIR/settings.json"
          # Both halves, or the mid-task one goes back to being code nobody
          # reaches: it shipped once already with no hook pointing at it.
          grep -q 'PreToolUse' "$CLAUDE_CONFIG_DIR/settings.json"
          grep -q -- '-Midtask' "$CLAUDE_CONFIG_DIR/settings.json"
          cat "$HOME"/.zshrc "$HOME"/.bashrc "$HOME"/.profile 2>/dev/null |
            grep -q 'kebacc-antigravity account switcher'
          "$HOME/.claude-tools/kebacc-antigravity" doctor > /dev/null

          # --yes: the uninstall asks before taking anything, and there is no
          # terminal here to answer it from. It is run from the installed copy,
          # which is how somebody actually reaches it.
          "$HOME/.claude-tools/kebacc-antigravity" uninstall --yes

          test ! -e "$HOME/.claude-tools/kebacc-antigravity"
          # Every command that was installed, not just the easy ones: the
          # sweep leaves the other halves' names where they are.
          for file in plugins/kebacc-antigravity/src/commands/*.md; do
            test ! -e "$CLAUDE_CONFIG_DIR/commands/${file##*/}" || {
              echo "the uninstall left ${file##*/} behind" >&2
              exit 1
            }
          done
          ! grep -q 'statusLine' "$CLAUDE_CONFIG_DIR/settings.json"
          # Neither hook may outlive the binary they point at.
          ! grep -q 'SessionStart' "$CLAUDE_CONFIG_DIR/settings.json"
          ! grep -q 'PreToolUse' "$CLAUDE_CONFIG_DIR/settings.json"
          ! cat "$HOME"/.zshrc "$HOME"/.bashrc "$HOME"/.profile 2>/dev/null |
            grep -q 'kebacc-antigravity account switcher'
          echo 'installed and uninstalled cleanly'

      # The same on Windows, where deleting a running binary is not allowed:
      # the uninstall hands the last of it to a copy it leaves behind, and this
      # is where that is checked on a machine that is not the one it was
      # written on.
      - name: The binary installs and uninstalls itself
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sandbox = Join-Path $env:RUNNER_TEMP ('install-' + [guid]::NewGuid().ToString('N'))
          $tools = Join-Path $sandbox 'tools'
          $env:CLAUDE_CONFIG_DIR = Join-Path $sandbox 'claude'
          $env:KEBACC_SWITCH_ANTIGRAVITY_ACCOUNTS = Join-Path $sandbox 'accounts'
          New-Item -ItemType Directory -Path $env:CLAUDE_CONFIG_DIR -Force | Out-Null
          $settingsPath = Join-Path $env:CLAUDE_CONFIG_DIR 'settings.json'
          # A status line somebody else holds: ours displaces it on the way in
          # and has to hand it back on the way out.
          '{"model":"opus","statusLine":{"type":"command","command":"starship prompt"}}' | Set-Content -LiteralPath $settingsPath

          target/release/kebacc-antigravity.exe install -ToolsDir $tools -StatusLine -AutoSwitch antigravity -NoProfileEdit
          if ($LASTEXITCODE -ne 0) { throw "install exited $LASTEXITCODE" }

          $settings = Get-Content -LiteralPath $settingsPath -Raw
          # Both halves, and the settings that were already there.
          foreach ($needle in 'statusLine', 'SessionStart', 'PreToolUse', '-Midtask', '"opus"') {
            if ($settings -notmatch [regex]::Escape($needle)) { throw "settings.json is missing $needle" }
          }

          $exe = Join-Path $tools 'kebacc-antigravity.exe'
          & $exe uninstall -ToolsDir $tools -NoProfileEdit -Yes
          if ($LASTEXITCODE -ne 0) { throw "uninstall exited $LASTEXITCODE" }

          $settings = Get-Content -LiteralPath $settingsPath -Raw
          # Neither hook may outlive the binary they point at, and nothing of
          # ours may be left in the status line either.
          foreach ($needle in 'kebacc-antigravity', 'SessionStart', 'PreToolUse') {
            if ($settings -match [regex]::Escape($needle)) { throw "the uninstall left $needle behind" }
          }
          # The copy left behind waits for this process to let go of the name,
          # so the binary goes a moment after the command that removed it.
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path -LiteralPath $exe) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
          if (Test-Path -LiteralPath $exe) { throw 'the binary is still there' }
          if (Test-Path -LiteralPath $tools) { throw 'the tools directory is still there' }
          $line = ($settings | ConvertFrom-Json).statusLine.command
          if ($line -ne 'starship prompt') { throw "the displaced status line did not come back: $line" }
          Write-Host 'installed and uninstalled cleanly, and starship has its status line back'

      # The published binary is what most people will actually run, so the
      # newest release is installed here the way they would install it: one
      # file downloaded, asked to install itself.
      - name: The published release installs and runs
        if: runner.os != 'Windows'
        # The anonymous rate limit is per address, and a runner shares its
        # address with everything else on that machine, so an unauthenticated
        # lookup here answers 403 often enough to fail a green build.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sandbox=$(mktemp -d)
          export HOME="$sandbox/home"
          export CLAUDE_CONFIG_DIR="$sandbox/claude"
          export KEBACC_SWITCH_ANTIGRAVITY_ACCOUNTS="$sandbox/accounts"
          mkdir -p "$HOME" "$CLAUDE_CONFIG_DIR"

          # The same names cmd/update.rs asks for, so this downloads the file a
          # machine updating itself would have downloaded.
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64)  asset=kebacc-antigravity-aarch64-apple-darwin ;;
            Darwin-x86_64) asset=kebacc-antigravity-x86_64-apple-darwin ;;
            Linux-aarch64) asset=kebacc-antigravity-aarch64-unknown-linux-gnu ;;
            *)             asset=kebacc-antigravity-x86_64-unknown-linux-gnu ;;
          esac
          # The newest kebacc-antigravity-v tag, named outright: the same repository
          # publishes the other halves under tags of their own, and a download
          # with no tag takes whichever of the two is the Latest release and
          # then finds none of this half's assets on it.
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("kebacc-antigravity-v"))] | first | .tagName // ""')
          # This half has yet to be released, so there is nothing published to
          # install here. The first kebacc-antigravity-v tag turns this gate
          # back on by itself.
          if [ -z "$tag" ]; then
            echo "no kebacc-antigravity-v release yet, so there is nothing to install"
            exit 0
          fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$sandbox" --clobber
          chmod +x "$sandbox/$asset"

          # The release that is out was published before the installer moved
          # into the binary, so there is no `install` on it to run. That is a
          # release yet to be cut rather than a broken build, and saying so
          # beats a red build that nothing in the tree can turn green. The next
          # release brings this gate back by itself.
          if ! "$sandbox/$asset" --help 2>&1 | grep -q '^  install '; then
            echo "the published release predates the built-in installer, so there is nothing to install yet"
            exit 0
          fi

          "$sandbox/$asset" install --no-profile-edit

          test -x "$HOME/.claude-tools/kebacc-antigravity"
          "$HOME/.claude-tools/kebacc-antigravity" --version
          "$HOME/.claude-tools/kebacc-antigravity" doctor > /dev/null
          test -f "$CLAUDE_CONFIG_DIR/commands/kebacc-list-antigravity.md"
          "$HOME/.claude-tools/kebacc-antigravity" uninstall --yes
          echo 'the published binary installs and runs'

      # install-antigravity.bat runs `install` on the file it downloads, so the release it
      # would fetch has to be one that carries that command. The question is
      # asked here, in a shell that can quote a path and read an exit code,
      # rather than in the cmd script below.
      - name: Does the published release know how to install itself
        id: published
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The runners are x64, which is the only asset this needs; install-antigravity.bat
          # picks the arm64 one on a machine that has it.
          $asset = 'kebacc-antigravity-x86_64-pc-windows-msvc.exe'
          $dir = Join-Path $env:RUNNER_TEMP 'probe'
          $tag = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("kebacc-antigravity-v"))] | first | .tagName // ""'
          if (-not $tag) {
            Write-Host 'no kebacc-antigravity-v release yet, so there is nothing to install'
            "installer=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $asset --dir $dir --clobber
          if ($LASTEXITCODE -ne 0) { throw "$tag has no $asset on it" }
          $help = & (Join-Path $dir $asset) --help 2>&1 | Out-String
          $knows = $help -match '(?m)^  install '
          "installer=$($knows.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if (-not $knows) {
            Write-Host 'the published release predates the built-in installer, so there is nothing to install yet'
          }

      # The Windows half of the same thing, run through install-antigravity.bat: that file
      # is what a double-click reaches, and nothing else tests it.
      - name: install-antigravity.bat installs the published release
        if: runner.os == 'Windows' && steps.published.outputs.installer == 'true'
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Nobody is here to press a key at the end of it.
          KEBACC_NO_PAUSE: "1"
        run: |
          set "CLAUDE_CONFIG_DIR=%RUNNER_TEMP%\bat-claude"
          set "KEBACC_SWITCH_ANTIGRAVITY_ACCOUNTS=%RUNNER_TEMP%\bat-accounts"
          set "TOOLS=%RUNNER_TEMP%\bat-tools"
          mkdir "%CLAUDE_CONFIG_DIR%"
          call install-antigravity.bat -ToolsDir "%TOOLS%" -NoProfileEdit || exit /b 1
          "%TOOLS%\kebacc-antigravity.exe" --version || exit /b 1
          "%TOOLS%\kebacc-antigravity.exe" doctor >nul || exit /b 1
          if not exist "%CLAUDE_CONFIG_DIR%\commands\kebacc-list-antigravity.md" exit /b 1
          "%TOOLS%\kebacc-antigravity.exe" uninstall -ToolsDir "%TOOLS%" -NoProfileEdit -Yes || exit /b 1
          echo the published binary installs and runs
