name: ci

# The project is written on Windows, so this is what says whether it still
# builds anywhere else. Every push runs the tests on the three platforms it
# claims to support, and installs the binaries it just built on each of them:
# each binary is its own installer, so that is the installer being tested.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:

  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The version a plugin stamps into its marker file, the version its
      # manifest advertises, and the version cargo built are three copies of one
      # number. A release where they disagree installs a binary that then thinks
      # it is out of date, and updates itself in a loop.
      - name: The versions agree
        run: |
          set -eu
          crate=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' crates/kebacc/Cargo.toml | head -n 1)
          marked=$(tr -d ' \t\r\n' < plugins/kebacc/VERSION)
          manifest=$(sed -n 's/.*"version" *: *"\([^"]*\)".*/\1/p' plugins/kebacc/.claude-plugin/plugin.json | head -n 1)
          test "$marked" = "$crate" || {
            echo "plugins/kebacc/VERSION is $marked, the crate is $crate" >&2
            exit 1
          }
          test "$manifest" = "$crate" || {
            echo "plugin.json says $manifest, the crate is $crate" >&2
            exit 1
          }
          echo "the plugin, its manifest and the crate all say $crate"

      # The binary carries the slash commands inside it, one include_str! each,
      # so a command added to the directory and forgotten in install.rs ships as
      # a command nobody gets, and a name left in install.rs after its file is
      # deleted fails the build.
      - name: Every command on disk is one the binary carries
        run: |
          set -eu
          bad=0
          carried=$(grep -o "commands/kebacc-[^\"]*\.md" "crates/kebacc/src/cmd/install.rs" |
            sed 's|.*/||' | sort -u)
          for file in plugins/kebacc/src/commands/*.md; do
            name=${file##*/}
            echo "$carried" | grep -qx "$name" ||
              { echo "$name is on disk but not carried" >&2; bad=1; }
          done
          for name in $carried; do
            [ -f "plugins/kebacc/src/commands/$name" ] ||
              { echo "$name is carried but not on disk" >&2; bad=1; }
          done
          test "$bad" = 0
          echo "every plugin command is carried"

      # The marketplace entry has to point at a plugin that is actually there.
      - name: The marketplace entry resolves
        run: |
          set -eu
          for file in .claude-plugin/marketplace.json plugins/kebacc/.claude-plugin/plugin.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$file"
          done
          test -d plugins/kebacc/src/commands
          echo "the marketplace points at plugins/kebacc"

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --workspace

      - name: Test
        run: cargo test --release --workspace

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --release --all-targets --workspace -- -D warnings

      - name: They run
        shell: bash
        run: |
          set -eu
          cargo run --release -p kebacc -- --version

      - name: The binaries install and uninstall themselves
        if: runner.os != 'Windows'
        run: |
          set -eu
          sandbox=$(mktemp -d)
          export HOME="$sandbox/home"
          export CLAUDE_CONFIG_DIR="$sandbox/claude"
          export KEBACC_SWITCH_ACCOUNTS="$sandbox/accounts"
          mkdir -p "$HOME" "$CLAUDE_CONFIG_DIR/commands"
          echo '{"model":"opus"}' > "$CLAUDE_CONFIG_DIR/settings.json"

          target/release/kebacc install --status-line --auto-switch all

          test -x "$HOME/.claude-tools/kebacc"
          test "$(cat "$HOME/.claude-tools/.version")" = "$(cat plugins/kebacc/VERSION)"
          test -f "$CLAUDE_CONFIG_DIR/commands/kebacc-list.md"
          test -f "$CLAUDE_CONFIG_DIR/commands/kebacc-add.md"
          test -f "$CLAUDE_CONFIG_DIR/commands/kebacc-auto.md"
          test ! -e "$CLAUDE_CONFIG_DIR/commands/kebacc-list-claude.md"
          test ! -e "$CLAUDE_CONFIG_DIR/commands/kebacc-list-all.md"
          grep -q '"model": *"opus"' "$CLAUDE_CONFIG_DIR/settings.json"
          grep -q 'statusLine' "$CLAUDE_CONFIG_DIR/settings.json"
          grep -q 'SessionStart' "$CLAUDE_CONFIG_DIR/settings.json"
          grep -q 'PreToolUse' "$CLAUDE_CONFIG_DIR/settings.json"
          grep -q -- '-Midtask' "$CLAUDE_CONFIG_DIR/settings.json"
          grep -q -- 'auto' "$CLAUDE_CONFIG_DIR/settings.json"
          ! grep -q -- '-Provider' "$CLAUDE_CONFIG_DIR/settings.json"
          cat "$HOME"/.zshrc "$HOME"/.bashrc "$HOME"/.profile 2>/dev/null |
            grep -q 'kebacc account switcher'
          "$HOME/.claude-tools/kebacc" doctor > /dev/null

          printf 'retired\n' > "$CLAUDE_CONFIG_DIR/commands/kebacc-install-codex.md"
          printf 'leftover\n' > "$HOME/.claude-tools/kebacc-codex"
          chmod +x "$HOME/.claude-tools/kebacc-codex"

          "$HOME/.claude-tools/kebacc" uninstall --yes

          test ! -e "$HOME/.claude-tools/kebacc"
          test ! -e "$HOME/.claude-tools/kebacc-codex"
          for file in plugins/kebacc/src/commands/*.md; do
            test ! -e "$CLAUDE_CONFIG_DIR/commands/${file##*/}" || {
              echo "the uninstall left ${file##*/} behind" >&2
              exit 1
            }
          done
          test ! -e "$CLAUDE_CONFIG_DIR/commands/kebacc-install-codex.md" || {
            echo "the uninstall left retired kebacc-install-codex.md behind" >&2
            exit 1
          }
          test ! -e "$CLAUDE_CONFIG_DIR/commands/kebacc-list.md"
          test ! -e "$CLAUDE_CONFIG_DIR/commands/kebacc-auto.md"
          ! grep -q 'statusLine' "$CLAUDE_CONFIG_DIR/settings.json"
          ! grep -q 'SessionStart' "$CLAUDE_CONFIG_DIR/settings.json"
          ! grep -q 'PreToolUse' "$CLAUDE_CONFIG_DIR/settings.json"
          ! cat "$HOME"/.zshrc "$HOME"/.bashrc "$HOME"/.profile 2>/dev/null |
            grep -q 'kebacc account switcher'
          echo 'kebacc installed and uninstalled cleanly'

      - name: The binary installs and uninstalls itself
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sandbox = Join-Path $env:RUNNER_TEMP ('install-' + [guid]::NewGuid().ToString('N'))
          $tools = Join-Path $sandbox 'tools'
          $env:CLAUDE_CONFIG_DIR = Join-Path $sandbox 'claude'
          $env:KEBACC_SWITCH_ACCOUNTS = Join-Path $sandbox 'accounts'
          New-Item -ItemType Directory -Path $env:CLAUDE_CONFIG_DIR -Force | Out-Null
          $settingsPath = Join-Path $env:CLAUDE_CONFIG_DIR 'settings.json'
          '{"model":"opus","statusLine":{"type":"command","command":"starship prompt"}}' | Set-Content -LiteralPath $settingsPath

          target/release/kebacc.exe install -ToolsDir $tools -StatusLine -AutoSwitch claude -NoProfileEdit
          if ($LASTEXITCODE -ne 0) { throw "install exited $LASTEXITCODE" }

          $settings = Get-Content -LiteralPath $settingsPath -Raw
          foreach ($needle in 'statusLine', 'SessionStart', 'PreToolUse', '-Midtask', '"opus"') {
            if ($settings -notmatch [regex]::Escape($needle)) { throw "settings.json is missing $needle" }
          }

          $exe = Join-Path $tools 'kebacc.exe'
          & $exe uninstall -ToolsDir $tools -NoProfileEdit -Yes
          if ($LASTEXITCODE -ne 0) { throw "uninstall exited $LASTEXITCODE" }

          $settings = Get-Content -LiteralPath $settingsPath -Raw
          foreach ($needle in 'kebacc.exe', 'SessionStart', 'PreToolUse') {
            if ($settings -match [regex]::Escape($needle)) { throw "the uninstall left $needle behind" }
          }
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path -LiteralPath $exe) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
          if (Test-Path -LiteralPath $exe) { throw 'the binary is still there' }
          if (Test-Path -LiteralPath $tools) { throw 'the tools directory is still there' }
          $line = ($settings | ConvertFrom-Json).statusLine.command
          if ($line -ne 'starship prompt') { throw "the displaced status line did not come back: $line" }
          Write-Host 'installed and uninstalled cleanly, and starship has its status line back'

      - name: One install writes every pool's commands and sweeps leftover binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sandbox = Join-Path $env:RUNNER_TEMP ('onebin-' + [guid]::NewGuid().ToString('N'))
          $tools = Join-Path $sandbox 'tools'
          $env:CLAUDE_CONFIG_DIR = Join-Path $sandbox 'claude'
          $env:KEBACC_SWITCH_ACCOUNTS = Join-Path $sandbox 'accounts'
          New-Item -ItemType Directory -Path $env:CLAUDE_CONFIG_DIR, $tools -Force | Out-Null
          '{}' | Set-Content -LiteralPath (Join-Path $env:CLAUDE_CONFIG_DIR 'settings.json')
          Set-Content -LiteralPath (Join-Path $tools 'kebacc-codex.exe') -Value 'leftover'

          target/release/kebacc.exe install -ToolsDir $tools -NoProfileEdit
          if ($LASTEXITCODE -ne 0) { throw "kebacc install exited $LASTEXITCODE" }

          if (Test-Path -LiteralPath (Join-Path $tools 'kebacc-codex.exe')) { throw 'leftover kebacc-codex.exe was not swept' }
          $commands = Join-Path $env:CLAUDE_CONFIG_DIR 'commands'
          foreach ($name in 'kebacc-list.md', 'kebacc-add.md', 'kebacc-auto.md') {
            if (-not (Test-Path -LiteralPath (Join-Path $commands $name))) { throw "$name is missing" }
          }
          if (Test-Path -LiteralPath (Join-Path $commands 'kebacc-list-claude.md')) { throw 'retired kebacc-list-claude.md was not swept' }
          Write-Host 'one install carries every pool'

      - name: The published release installs and runs
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sandbox=$(mktemp -d)
          export HOME="$sandbox/home"
          export CLAUDE_CONFIG_DIR="$sandbox/claude"
          export KEBACC_SWITCH_ACCOUNTS="$sandbox/accounts"
          mkdir -p "$HOME" "$CLAUDE_CONFIG_DIR"

          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64)  asset=kebacc-aarch64-apple-darwin ;;
            Darwin-x86_64) asset=kebacc-x86_64-apple-darwin ;;
            Linux-aarch64) asset=kebacc-aarch64-unknown-linux-gnu ;;
            *)             asset=kebacc-x86_64-unknown-linux-gnu ;;
          esac
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("kebacc-v"))] | first | .tagName // ""')
          if [ -z "$tag" ]; then
            echo "no kebacc-v release has been published yet, so there is nothing to install from a release"
            exit 0
          fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$sandbox" --clobber
          chmod +x "$sandbox/$asset"

          if ! "$sandbox/$asset" --help 2>&1 | grep -q '^  install '; then
            echo "the published release predates the built-in installer, so there is nothing to install yet"
            exit 0
          fi

          "$sandbox/$asset" install --no-profile-edit

          test -x "$HOME/.claude-tools/kebacc"
          "$HOME/.claude-tools/kebacc" --version
          "$HOME/.claude-tools/kebacc" doctor > /dev/null
          test -f "$CLAUDE_CONFIG_DIR/commands/kebacc-list.md"
          "$HOME/.claude-tools/kebacc" uninstall --yes
          echo 'the published binary installs and runs'

      - name: Does the published release know how to install itself
        id: published
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'kebacc-x86_64-pc-windows-msvc.exe'
          $dir = Join-Path $env:RUNNER_TEMP 'probe'
          $tag = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("kebacc-v"))] | first | .tagName // ""'
          if (-not $tag) {
            Write-Host 'no kebacc-v release has been published yet, so there is nothing to install from a release'
            "installer=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            return
          }
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $asset --dir $dir --clobber
          if ($LASTEXITCODE -ne 0) { throw "$tag has no $asset on it" }
          $help = & (Join-Path $dir $asset) --help 2>&1 | Out-String
          $knows = $help -match '(?m)^  install '
          "installer=$($knows.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if (-not $knows) {
            Write-Host 'the published release predates the built-in installer, so there is nothing to install yet'
          }

      - name: install.bat installs the published release
        if: runner.os == 'Windows' && steps.published.outputs.installer == 'true'
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KEBACC_NO_PAUSE: "1"
        run: |
          set "CLAUDE_CONFIG_DIR=%RUNNER_TEMP%\bat-claude"
          set "KEBACC_SWITCH_ACCOUNTS=%RUNNER_TEMP%\bat-accounts"
          set "TOOLS=%RUNNER_TEMP%\bat-tools"
          mkdir "%CLAUDE_CONFIG_DIR%"
          call install.bat -ToolsDir "%TOOLS%" -NoProfileEdit || exit /b 1
          "%TOOLS%\kebacc.exe" --version || exit /b 1
          "%TOOLS%\kebacc.exe" doctor >nul || exit /b 1
          if not exist "%CLAUDE_CONFIG_DIR%\commands\kebacc-list.md" exit /b 1
          "%TOOLS%\kebacc.exe" uninstall -ToolsDir "%TOOLS%" -NoProfileEdit -Yes || exit /b 1
          echo the published binary installs and runs
