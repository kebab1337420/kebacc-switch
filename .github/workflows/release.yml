name: release

# Builds the binary for every platform the updater knows how to ask for and
# attaches it to the release of the tag that triggered this. The names are the
# ones `asset_name()` in cmd/update.rs builds, so a machine that updates itself
# finds its own file.
on:
  push:
    tags: ["kebacc-antigravity-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The existing release tag to attach binaries to
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Cross-compiled rather than run on an arm runner: the tests already
          # run natively on the x86_64 job, and this only has to produce a
          # binary.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            linux_cross: true
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
          # Built on the arm runner rather than on macos-13, whose queue is long
          # enough to hold a release up for an hour. The Apple toolchain builds
          # the other architecture without any extra compiler.
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ring builds C, so a cross build needs the cross compiler and a linker
      # told where to find it.
      - name: Cross compiler
        if: matrix.linux_cross
        run: |
          # A runner whose apt mirror is having a bad day can sit on either of
          # these until the job's own hour runs out, so each gets a few minutes
          # and a second try instead. Only the install has to succeed: an update
          # that timed out still leaves usable lists behind.
          timeout 240 sudo apt-get update || timeout 240 sudo apt-get update || true
          # libc6-dev-arm64-cross by name: it is what carries the target's libc
          # headers, which ring's C needs, and it arrives only as a recommend.
          timeout 300 sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross ||
            timeout 300 sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"

      - name: Test
        if: '!matrix.cross'
        run: cargo test --release --target ${{ matrix.target }} -p kebacc-antigravity

      # The paths of the machine that built it have no business being in a
      # published binary.
      - name: Build
        shell: bash
        run: |
          export CARGO_ENCODED_RUSTFLAGS="--remap-path-prefix=$PWD=."
          cargo build --release --target ${{ matrix.target }} -p kebacc-antigravity

      - name: Name it after its platform
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/kebacc-antigravity.exe" "dist/kebacc-antigravity-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/kebacc-antigravity" "dist/kebacc-antigravity-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kebacc-antigravity-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The installers are published beside the binaries so a machine with
      # neither a clone nor a toolchain can start from one file.
      - name: Attach everything to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cp plugins/kebacc-antigravity/bootstrap.ps1 plugins/kebacc-antigravity/bootstrap.sh \
             install-antigravity.bat dist/
          ls -l dist
          # The release is held as a draft until its binaries are on it. A
          # release page that exists with nothing to download is not much use
          # to a reader, and the install test in ci.yml fails outright on one:
          # it finds the newest published release and asks for its binary.
          # --latest=false: this half shares a repository with the Claude one,
          # and the label on the repository's front page should keep pointing at
          # that one. Nothing here reads the label anyway, the installers pick
          # their release by tag prefix off the release list.
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --draft --latest=false --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
          # Published last, in one step, with everything already attached. This
          # leaves the notes alone, whoever wrote them, and the release goes out
          # as a full one: a half whose every release is flagged a preview has
          # no release a reader can point at as the one that is out.
          gh release edit "$TAG" --draft=false
