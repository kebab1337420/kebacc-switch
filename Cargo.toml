[workspace]
members = [
    "crates/kebacc-core",
    "crates/kebacc",
]
resolver = "2"

# The switcher is a short-lived command whose cost is process startup, not
# throughput: optimising it for size instead of speed takes ~250 KB off the
# binary and leaves the status line at the same 15 ms.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
