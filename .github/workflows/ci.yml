name: ci

# The project is written on Windows, so this is what says whether it still
# builds anywhere else. Every push runs the tests on the three platforms it
# claims to support, and lints the scripts each of them installs with.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p kebacc-switch

      - name: Test
        run: cargo test --release -p kebacc-switch

      - name: Clippy
        run: cargo clippy --release --all-targets -p kebacc-switch -- -D warnings

      # A binary that will not start says so here rather than on a user's
      # machine after the release is out.
      - name: It runs
        run: cargo run --release -p kebacc-switch -- --version

      - name: The shell scripts parse
        if: runner.os != 'Windows'
        run: |
          for script in plugins/kebacc-switch/*.sh; do
            sh -n "$script"
            echo "$script ok"
          done

      # The version a plugin stamps into its marker file, the version the binary
      # reports, and the version cargo built are three copies of one number. A
      # release where they disagree installs a binary that then thinks it is out
      # of date, and updates itself in a loop.
      - name: The versions agree
        if: runner.os != 'Windows'
        run: |
          set -eu
          crate=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' crates/kebacc-switch/Cargo.toml | head -n 1)
          marked=$(tr -d ' \t\r\n' < plugins/kebacc-switch/VERSION)
          test "$marked" = "$crate" || {
            echo "plugins/kebacc-switch/VERSION is $marked, the crate is $crate" >&2
            exit 1
          }
          echo "every VERSION says $crate"

      # The installers sweep the commands directory by pattern and skip anything
      # with `codex` in the name, because those belong to the other plugin. A
      # command shipped here that the sweep skips is one no update ever replaces
      # and no uninstall ever removes, so the pattern and what is shipped have
      # to agree.
      - name: Every command this plugin ships is one it also removes
        if: runner.os != 'Windows'
        run: |
          set -eu
          bad=0
          for file in plugins/kebacc-switch/src/commands/*.md; do
            name=${file##*/}
            case "$name" in
                kebacc-*.md) ;;
                *) echo "$name is not swept: the installers only know kebacc-*.md" >&2; bad=1; continue ;;
            esac
            # The one command with `codex` in its name that is ours, and the
            # uninstaller names it by hand for exactly this reason.
            case "$name" in
                kebacc-install-codex.md) grep -q "$name" plugins/kebacc-switch/uninstall.sh ||
                    { echo "$name is skipped by the codex filter and not named in uninstall.sh" >&2; bad=1; } ;;
                *codex*) echo "$name is skipped by the codex filter in both installers" >&2; bad=1 ;;
            esac
          done
          test "$bad" = 0
          echo "$(ls plugins/kebacc-switch/src/commands/*.md | wc -l | tr -d ' ') commands, all swept"

      # The installer is the half that has never been run outside Windows, so it
      # is run here for real, against directories made for the occasion.
      - name: install.sh puts everything where it says
        if: runner.os != 'Windows'
        run: |
          set -eu
          sandbox=$(mktemp -d)
          export HOME="$sandbox/home"
          export CLAUDE_CONFIG_DIR="$sandbox/claude"
          export KEBACC_SWITCH_ACCOUNTS="$sandbox/accounts"
          mkdir -p "$HOME" "$CLAUDE_CONFIG_DIR"
          echo '{"model":"opus"}' > "$CLAUDE_CONFIG_DIR/settings.json"

          sh plugins/kebacc-switch/install.sh             --binary target/release/kebacc-switch --status-line --auto-switch

          test -x "$HOME/.claude-tools/kebacc-switch"
          test "$(cat "$HOME/.claude-tools/.version")" = "$(cat plugins/kebacc-switch/VERSION)"
          test -f "$CLAUDE_CONFIG_DIR/commands/kebacc-list-claude.md"
          grep -q '"model": *"opus"' "$CLAUDE_CONFIG_DIR/settings.json"
          grep -q 'statusLine' "$CLAUDE_CONFIG_DIR/settings.json"
          grep -q 'SessionStart' "$CLAUDE_CONFIG_DIR/settings.json"
          # Both halves, or the mid-task one goes back to being code nobody
          # reaches: it shipped once already with no hook pointing at it.
          grep -q 'PreToolUse' "$CLAUDE_CONFIG_DIR/settings.json"
          grep -q -- '-Midtask' "$CLAUDE_CONFIG_DIR/settings.json"
          cat "$HOME"/.zshrc "$HOME"/.bashrc "$HOME"/.profile 2>/dev/null |
            grep -q 'kebacc-switch account switcher'
          "$HOME/.claude-tools/kebacc-switch" doctor > /dev/null

          sh plugins/kebacc-switch/uninstall.sh

          test ! -e "$HOME/.claude-tools/kebacc-switch"
          # Every command that was installed, not just the easy ones: the sweep
          # skips `*codex*`, and this plugin ships one such name of its own.
          for file in plugins/kebacc-switch/src/commands/*.md; do
            test ! -e "$CLAUDE_CONFIG_DIR/commands/${file##*/}" || {
              echo "uninstall.sh left ${file##*/} behind" >&2
              exit 1
            }
          done
          ! grep -q 'statusLine' "$CLAUDE_CONFIG_DIR/settings.json"
          # Neither hook may outlive the binary they point at.
          ! grep -q 'SessionStart' "$CLAUDE_CONFIG_DIR/settings.json"
          ! grep -q 'PreToolUse' "$CLAUDE_CONFIG_DIR/settings.json"
          ! cat "$HOME"/.zshrc "$HOME"/.bashrc "$HOME"/.profile 2>/dev/null |
            grep -q 'kebacc-switch account switcher'
          echo 'installed and uninstalled cleanly'

      # `install.ps1` is what Windows users run, and it now hands the hooks to
      # `arm` rather than writing them itself. Nothing else here exercises it:
      # the bootstrap job below installs the published release, not this build.
      - name: install.ps1 puts everything where it says
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sandbox = Join-Path $env:RUNNER_TEMP ('install-' + [guid]::NewGuid().ToString('N'))
          $tools = Join-Path $sandbox 'tools'
          $env:CLAUDE_CONFIG_DIR = Join-Path $sandbox 'claude'
          $env:KEBACC_SWITCH_ACCOUNTS = Join-Path $sandbox 'accounts'
          New-Item -ItemType Directory -Path $env:CLAUDE_CONFIG_DIR -Force | Out-Null
          $settingsPath = Join-Path $env:CLAUDE_CONFIG_DIR 'settings.json'
          # A status line somebody else holds: ours displaces it on the way in
          # and has to hand it back on the way out.
          '{"model":"opus","statusLine":{"type":"command","command":"starship prompt"}}' | Set-Content -LiteralPath $settingsPath

          pwsh -NoProfile -File plugins/kebacc-switch/install.ps1 -ToolsDir $tools -Binary target/release/kebacc-switch.exe -StatusLine -AutoSwitch claude -NoProfileEdit
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited $LASTEXITCODE" }

          $settings = Get-Content -LiteralPath $settingsPath -Raw
          # Both halves, and the settings that were already there.
          foreach ($needle in 'statusLine', 'SessionStart', 'PreToolUse', '-Midtask', '"opus"') {
            if ($settings -notmatch [regex]::Escape($needle)) { throw "settings.json is missing $needle" }
          }

          pwsh -NoProfile -File plugins/kebacc-switch/uninstall.ps1 -ToolsDir $tools -NoProfileEdit -Yes
          if ($LASTEXITCODE -ne 0) { throw "uninstall.ps1 exited $LASTEXITCODE" }

          $settings = Get-Content -LiteralPath $settingsPath -Raw
          # Neither hook may outlive the binary they point at, and nothing of
          # ours may be left in the status line either.
          foreach ($needle in 'kebacc-switch', 'SessionStart', 'PreToolUse') {
            if ($settings -match [regex]::Escape($needle)) { throw "uninstall.ps1 left $needle behind" }
          }
          if (Test-Path -LiteralPath (Join-Path $tools 'kebacc-switch.exe')) { throw 'the binary is still there' }
          $line = ($settings | ConvertFrom-Json).statusLine.command
          if ($line -ne 'starship prompt') { throw "the displaced status line did not come back: $line" }
          Write-Host 'installed and uninstalled cleanly, and starship has its status line back'

      # The published binary and the one-command install are what most people
      # will actually run, so the newest release is installed here the way they
      # would install it.
      - name: bootstrap.sh installs the published release
        if: runner.os != 'Windows'
        # The anonymous rate limit is per address, and a runner shares its
        # address with everything else on that machine, so an unauthenticated
        # lookup here answers 403 often enough to fail a green build.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sandbox=$(mktemp -d)
          export HOME="$sandbox/home"
          export CLAUDE_CONFIG_DIR="$sandbox/claude"
          export KEBACC_SWITCH_ACCOUNTS="$sandbox/accounts"
          mkdir -p "$HOME" "$CLAUDE_CONFIG_DIR"

          sh plugins/kebacc-switch/bootstrap.sh --no-profile-edit

          test -x "$HOME/.claude-tools/kebacc-switch"
          "$HOME/.claude-tools/kebacc-switch" --version
          "$HOME/.claude-tools/kebacc-switch" doctor > /dev/null
          sh plugins/kebacc-switch/uninstall.sh
          echo 'the published binary installs and runs'

      # The Windows half of the one-command install, run the same way as the
      # POSIX one: against the newest release, into directories made for the
      # occasion, and with the profile left alone since it lives outside both.
      - name: bootstrap.ps1 installs the published release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sandbox = Join-Path $env:RUNNER_TEMP ('bootstrap-' + [guid]::NewGuid().ToString('N'))
          $tools = Join-Path $sandbox 'tools'
          $env:CLAUDE_CONFIG_DIR = Join-Path $sandbox 'claude'
          $env:KEBACC_SWITCH_ACCOUNTS = Join-Path $sandbox 'accounts'
          New-Item -ItemType Directory -Path $env:CLAUDE_CONFIG_DIR -Force | Out-Null

          pwsh -NoProfile -File plugins/kebacc-switch/bootstrap.ps1 -ToolsDir $tools -NoProfileEdit
          if ($LASTEXITCODE -ne 0) { throw "bootstrap.ps1 exited $LASTEXITCODE" }

          $exe = Join-Path $tools 'kebacc-switch.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Nothing was installed at $exe" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "The installed binary would not report its version" }
          & $exe doctor | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "doctor exited $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath (Join-Path $env:CLAUDE_CONFIG_DIR 'commands/kebacc-list-claude.md'))) {
            throw 'The slash commands were not installed'
          }

          pwsh -NoProfile -File plugins/kebacc-switch/uninstall.ps1 -ToolsDir $tools -NoProfileEdit -Yes
          if ($LASTEXITCODE -ne 0) { throw "uninstall.ps1 exited $LASTEXITCODE" }
          if (Test-Path -LiteralPath $exe) { throw 'The uninstaller left the binary behind' }
          Write-Host 'the published binary installs and runs'

      - name: The PowerShell scripts parse
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bad = 0
          foreach ($script in Get-ChildItem plugins/kebacc-switch/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count) {
              Write-Host "$($script.Name) FAILED: $($errors[0].Message)"
              $bad = 1
            } else {
              Write-Host "$($script.Name) ok"
            }
          }
          exit $bad
