[package]
name = "kebacc-core"
version = "0.1.0"
description = "Shared JSON, lock, seal, process and colour helpers for kebacc binaries"
license = "MIT"
edition = "2021"
publish = false

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.23"
getrandom = "0.4"
aes-gcm = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_IO",
] }
