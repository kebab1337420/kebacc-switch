name: ci

# The project is written on Windows, so this is what says whether it still
# builds anywhere else. Every push runs the tests on the three platforms it
# claims to support, and installs the binary on each of them the way a user
# would.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p kebacc-codex

      - name: Test
        run: cargo test --release -p kebacc-codex

      # Three copies of this program live on three branches of this
      # repository, and a fix written on one is read side by side with the
      # others when it is carried over. Formatting left to drift turns every
      # one of those comparisons into a diff of line breaks with the real
      # change buried in it, so the format is settled here rather than by
      # whoever edits a file next.
      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --release --all-targets -p kebacc-codex -- -D warnings

      # A binary that will not start says so here rather than on a user's
      # machine after the release is out.
      - name: It runs
        run: cargo run --release -p kebacc-codex -- --version

      # The version a plugin stamps into its marker file, the version the binary
      # reports, and the version cargo built are three copies of one number. A
      # release where they disagree installs a binary that then thinks it is out
      # of date, and updates itself in a loop.
      - name: The versions agree
        if: runner.os != 'Windows'
        run: |
          set -eu
          crate=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' crates/kebacc-codex/Cargo.toml | head -n 1)
          marked=$(tr -d ' \t\r\n' < plugins/kebacc-codex/VERSION)
          test "$marked" = "$crate" || {
            echo "plugins/kebacc-codex/VERSION is $marked, the crate is $crate" >&2
            exit 1
          }
          echo "every VERSION says $crate"

      # The binary carries the slash commands inside it, one include_str! each,
      # so a command added to the directory and forgotten in COMMANDS ships as
      # a command nobody gets, and a name left in COMMANDS after its file is
      # deleted fails the build. Both directories are checked: the ones this
      # half owns, and the pair that only means anything with both halves
      # present. The sweep side of the same promise — that every shipped command
      # is one the uninstall also takes back — is a unit test in install.rs.
      - name: Every command on disk is one the binary carries
        if: runner.os != 'Windows'
        run: |
          set -eu
          bad=0
          # The include_str! paths, not every quoted name in the file: the
          # tests name commands this plugin deliberately does not carry.
          carried=$(grep -o 'commands\(-all\)\?/kebacc-[^"]*\.md' crates/kebacc-codex/src/cmd/install.rs |
            sed 's|.*/||' | sort -u)
          for file in plugins/kebacc-codex/src/commands/*.md plugins/kebacc-codex/src/commands-all/*.md; do
            name=${file##*/}
            echo "$carried" | grep -qx "$name" ||
              { echo "$name is on disk but not carried by the binary" >&2; bad=1; }
          done
          for name in $carried; do
            [ -f "plugins/kebacc-codex/src/commands/$name" ] ||
              [ -f "plugins/kebacc-codex/src/commands-all/$name" ] ||
              { echo "$name is carried by the binary but not on disk" >&2; bad=1; }
          done
          test "$bad" = 0
          echo "$(ls plugins/kebacc-codex/src/commands/*.md plugins/kebacc-codex/src/commands-all/*.md | wc -l | tr -d ' ') commands, all carried"

      # There is no install script any more: `kebacc-codex install` is the
      # installer, and it carries the slash commands inside it. What used to be
      # install.sh and install.ps1 is this one code path, run here for real on
      # every platform, against directories made for the occasion.
      - name: The binary installs and uninstalls itself
        if: runner.os != 'Windows'
        run: |
          set -eu
          sandbox=$(mktemp -d)
          export HOME="$sandbox/home"
          export CLAUDE_CONFIG_DIR="$sandbox/claude"
          export KEBACC_SWITCH_CODEX_ACCOUNTS="$sandbox/codex-accounts"
          mkdir -p "$HOME" "$CLAUDE_CONFIG_DIR"
          echo '{"model":"opus"}' > "$CLAUDE_CONFIG_DIR/settings.json"
          # The Claude half, as far as this half can tell it is there: its
          # marker is what makes the commands spanning both pools mean anything.
          mkdir -p "$HOME/.claude-tools"
          printf '0.0.0' > "$HOME/.claude-tools/.version"

          target/release/kebacc-codex install --status-line --auto-switch

          test -x "$HOME/.claude-tools/kebacc-codex"
          test "$(cat "$HOME/.claude-tools/.codex-version")" = "$(cat plugins/kebacc-codex/VERSION)"
          test -f "$CLAUDE_CONFIG_DIR/commands/kebacc-list-codex.md"
          # Both halves are there, so the pair that spans them is too.
          test -f "$CLAUDE_CONFIG_DIR/commands/kebacc-list-all.md"
          test -f "$CLAUDE_CONFIG_DIR/commands/kebacc-auto-all.md"
          grep -q '"model": *"opus"' "$CLAUDE_CONFIG_DIR/settings.json"
          grep -q 'statusLine' "$CLAUDE_CONFIG_DIR/settings.json"
          grep -q 'SessionStart' "$CLAUDE_CONFIG_DIR/settings.json"
          # Both halves, or the mid-task one goes back to being code nobody
          # reaches: it shipped once already with no hook pointing at it.
          grep -q 'PreToolUse' "$CLAUDE_CONFIG_DIR/settings.json"
          grep -q -- '-Midtask' "$CLAUDE_CONFIG_DIR/settings.json"
          # One pair of hooks, never two: SessionStart and PreToolUse.
          test "$(grep -c 'auto -Provider' "$CLAUDE_CONFIG_DIR/settings.json")" = 2
          cat "$HOME"/.zshrc "$HOME"/.bashrc "$HOME"/.profile 2>/dev/null |
            grep -q 'kebacc-codex account switcher'
          "$HOME/.claude-tools/kebacc-codex" doctor > /dev/null

          # --yes: the uninstall asks before taking anything, and there is no
          # terminal here to answer it from. It is run from the installed copy,
          # which is how somebody actually reaches it.
          "$HOME/.claude-tools/kebacc-codex" uninstall --yes

          test ! -e "$HOME/.claude-tools/kebacc-codex"
          for file in plugins/kebacc-codex/src/commands/*.md; do
            test ! -e "$CLAUDE_CONFIG_DIR/commands/${file##*/}" || {
              echo "the uninstall left ${file##*/} behind" >&2
              exit 1
            }
          done
          # With one half gone the pair that spans both means nothing.
          test ! -e "$CLAUDE_CONFIG_DIR/commands/kebacc-list-all.md"
          test ! -e "$CLAUDE_CONFIG_DIR/commands/kebacc-auto-all.md"
          # The Claude half's marker is not ours, and is still where it was.
          test -f "$HOME/.claude-tools/.version"
          ! grep -q 'statusLine' "$CLAUDE_CONFIG_DIR/settings.json"
          # Neither hook may outlive the binary they point at.
          ! grep -q 'SessionStart' "$CLAUDE_CONFIG_DIR/settings.json"
          ! grep -q 'PreToolUse' "$CLAUDE_CONFIG_DIR/settings.json"
          ! cat "$HOME"/.zshrc "$HOME"/.bashrc "$HOME"/.profile 2>/dev/null |
            grep -q 'kebacc-codex account switcher'
          echo 'installed and uninstalled cleanly'

      # The same on Windows, where deleting a running binary is not allowed:
      # the uninstall hands the last of it to a copy it leaves behind, and this
      # is where that is checked on a machine that is not the one it was
      # written on.
      - name: The binary installs and uninstalls itself
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sandbox = Join-Path $env:RUNNER_TEMP ('install-' + [guid]::NewGuid().ToString('N'))
          $tools = Join-Path $sandbox 'tools'
          $env:CLAUDE_CONFIG_DIR = Join-Path $sandbox 'claude'
          $env:KEBACC_SWITCH_CODEX_ACCOUNTS = Join-Path $sandbox 'codex-accounts'
          New-Item -ItemType Directory -Path $env:CLAUDE_CONFIG_DIR -Force | Out-Null
          $settingsPath = Join-Path $env:CLAUDE_CONFIG_DIR 'settings.json'
          # A status line somebody else holds: ours displaces it on the way in
          # and has to hand it back on the way out.
          '{"model":"opus","statusLine":{"type":"command","command":"starship prompt"}}' | Set-Content -LiteralPath $settingsPath
          # The Claude half, as far as this half can tell it is there.
          New-Item -ItemType Directory -Path $tools -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $tools '.version') -Value '0.0.0' -NoNewline

          target/release/kebacc-codex.exe install -ToolsDir $tools -StatusLine -AutoSwitch -NoProfileEdit
          if ($LASTEXITCODE -ne 0) { throw "install exited $LASTEXITCODE" }

          $settings = Get-Content -LiteralPath $settingsPath -Raw
          # Both halves, and the settings that were already there.
          foreach ($needle in 'statusLine', 'SessionStart', 'PreToolUse', '-Midtask', '"opus"') {
            if ($settings -notmatch [regex]::Escape($needle)) { throw "settings.json is missing $needle" }
          }
          foreach ($name in 'kebacc-list-codex.md', 'kebacc-list-all.md', 'kebacc-auto-all.md') {
            if (-not (Test-Path -LiteralPath (Join-Path $env:CLAUDE_CONFIG_DIR "commands/$name"))) {
              throw "$name was not installed"
            }
          }

          $exe = Join-Path $tools 'kebacc-codex.exe'
          & $exe uninstall -ToolsDir $tools -NoProfileEdit -Yes
          if ($LASTEXITCODE -ne 0) { throw "uninstall exited $LASTEXITCODE" }

          $settings = Get-Content -LiteralPath $settingsPath -Raw
          # Neither hook may outlive the binary they point at, and nothing of
          # ours may be left in the status line either.
          foreach ($needle in 'kebacc-codex', 'SessionStart', 'PreToolUse') {
            if ($settings -match [regex]::Escape($needle)) { throw "the uninstall left $needle behind" }
          }
          # The copy left behind waits for this process to let go of the name,
          # so the binary goes a moment after the command that removed it.
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path -LiteralPath $exe) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
          if (Test-Path -LiteralPath $exe) { throw 'the binary is still there' }
          # The directory stays: the Claude half's marker is still in it, and
          # taking the directory would uninstall a plugin nobody asked about.
          if (-not (Test-Path -LiteralPath (Join-Path $tools '.version'))) {
            throw "the uninstall took the other half's marker"
          }
          $line = ($settings | ConvertFrom-Json).statusLine.command
          if ($line -ne 'starship prompt') { throw "the displaced status line did not come back: $line" }
          # With one half gone the pair that spans both means nothing.
          foreach ($name in 'kebacc-list-all.md', 'kebacc-auto-all.md') {
            if (Test-Path -LiteralPath (Join-Path $env:CLAUDE_CONFIG_DIR "commands/$name")) {
              throw "$name outlived the uninstall"
            }
          }
          Write-Host 'installed and uninstalled cleanly, and starship has its status line back'

      # The published binary is what most people will actually run, so the
      # newest release is installed here the way they would install it: one
      # file downloaded, asked to install itself.
      - name: The published release installs and runs
        if: runner.os != 'Windows'
        # The anonymous rate limit is per address, and a runner shares its
        # address with everything else on that machine, so an unauthenticated
        # lookup here answers 403 often enough to fail a green build.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # The newest kebacc-codex-v tag, named outright: the repository's
          # Latest release is the Claude half's, and a download with no tag
          # takes that one and finds none of this half's assets on it. Nothing
          # of this half is published until the first such tag goes out, which
          # this says rather than failing the build.
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("kebacc-codex-v"))] | first | .tagName // ""')
          if [ -z "$tag" ]; then
            echo 'No release of this half is published yet, so there is nothing to install.'
            exit 0
          fi
          sandbox=$(mktemp -d)
          export HOME="$sandbox/home"
          export CLAUDE_CONFIG_DIR="$sandbox/claude"
          export KEBACC_SWITCH_CODEX_ACCOUNTS="$sandbox/codex-accounts"
          mkdir -p "$HOME" "$CLAUDE_CONFIG_DIR"

          # The same names cmd/update.rs asks for, so this downloads the file a
          # machine updating itself would have downloaded.
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64)  asset=kebacc-codex-aarch64-apple-darwin ;;
            Darwin-x86_64) asset=kebacc-codex-x86_64-apple-darwin ;;
            Linux-aarch64) asset=kebacc-codex-aarch64-unknown-linux-gnu ;;
            *)             asset=kebacc-codex-x86_64-unknown-linux-gnu ;;
          esac
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$sandbox" --clobber
          chmod +x "$sandbox/$asset"

          # That release was published before the installer moved into the
          # binary, so there is no `install` on it to run. That is a release yet
          # to be cut rather than a broken build, and saying so beats a red
          # build that nothing in the tree can turn green. The next release
          # brings this gate back by itself.
          if ! "$sandbox/$asset" --help 2>&1 | grep -q '^  install '; then
            echo "$tag predates the built-in installer, so there is nothing to install yet"
            exit 0
          fi

          "$sandbox/$asset" install --no-profile-edit

          test -x "$HOME/.claude-tools/kebacc-codex"
          "$HOME/.claude-tools/kebacc-codex" --version
          "$HOME/.claude-tools/kebacc-codex" doctor > /dev/null
          test -f "$CLAUDE_CONFIG_DIR/commands/kebacc-list-codex.md"
          "$HOME/.claude-tools/kebacc-codex" uninstall --yes --no-profile-edit
          echo 'the published binary installs and runs'

      # install-codex.bat runs `install` on the file it downloads, so the
      # release it would fetch has to be one that carries that command. The
      # question is asked here, in a shell that can quote a JSON filter and read
      # an exit code, rather than in the cmd script below. No release of this
      # half at all is not a failure either: the bat answers 2 for that, and
      # this leaves the step to say so.
      - name: Does the published release know how to install itself
        id: published
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The runners are x64, which is the only asset this needs;
          # install-codex.bat picks the arm64 one on a machine that has it.
          $asset = 'kebacc-codex-x86_64-pc-windows-msvc.exe'
          $dir = Join-Path $env:RUNNER_TEMP 'probe'
          $tag = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("kebacc-codex-v"))] | first | .tagName // ""'
          $knows = $false
          if (-not $tag) {
            Write-Host 'No release of this half is published yet, so there is nothing to install.'
          } else {
            gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $asset --dir $dir --clobber
            if ($LASTEXITCODE -ne 0) { throw "$tag has no $asset on it" }
            $help = & (Join-Path $dir $asset) --help 2>&1 | Out-String
            $knows = $help -match '(?m)^  install '
            if (-not $knows) {
              Write-Host "$tag predates the built-in installer, so there is nothing to install yet"
            }
          }
          "installer=$($knows.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # The Windows half of the same thing, run through install-codex.bat: that
      # file is what a double-click reaches, and nothing else tests it.
      - name: install-codex.bat installs the published release
        if: runner.os == 'Windows' && steps.published.outputs.installer == 'true'
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Nobody is here to press a key at the end of it.
          KEBACC_NO_PAUSE: "1"
        run: |
          set "CLAUDE_CONFIG_DIR=%RUNNER_TEMP%\bat-claude"
          set "KEBACC_SWITCH_CODEX_ACCOUNTS=%RUNNER_TEMP%\bat-accounts"
          set "TOOLS=%RUNNER_TEMP%\bat-tools"
          mkdir "%CLAUDE_CONFIG_DIR%"
          call install-codex.bat -ToolsDir "%TOOLS%" -NoProfileEdit
          rem 2 is what the installer answers when no release of this half is
          rem published yet. There is nothing to test until the first one is.
          if errorlevel 2 (
            echo No release of this half is published yet, so there is nothing to install.
            exit /b 0
          )
          if errorlevel 1 exit /b 1
          "%TOOLS%\kebacc-codex.exe" --version || exit /b 1
          "%TOOLS%\kebacc-codex.exe" doctor >nul || exit /b 1
          if not exist "%CLAUDE_CONFIG_DIR%\commands\kebacc-list-codex.md" exit /b 1
          "%TOOLS%\kebacc-codex.exe" uninstall -ToolsDir "%TOOLS%" -NoProfileEdit -Yes || exit /b 1
          echo the published binary installs and runs
